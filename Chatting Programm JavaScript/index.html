    <section class="stack-style" id="feat">

        <div class="feature-stack">

          <div class="experience__content">
                 <input class="username" id="username" placeholder="Enter you User Name">
                  <ul id="dmessages"> 
        
                  </ul>

                  <div class="sendMessage">
                <input class="message" id="message" placeholder="message" autocomplete="off">

                <button class="sendbutton" onclick="return sendMessage();"> Send </button>
                </div> 

               <button class="refresh" onclick="return deleteMessage();"> Delete/Refresh</button>
           </div>
       </div>

    </script>
